name: appforge_demo
description: "羊毛日历 - 本地记录薅羊毛活动，按设备分类、月历查看、支持 WebDAV 同步。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.3
  # 到点提醒：本地定时通知（不联网、不需要服务器推送）
  flutter_local_notifications: ^17.2.2
  flutter_timezone: ^3.0.0
  timezone: ^0.9.4
  # 读取手机系统日历（Android CalendarContract / iOS EventKit），只读、不写入
  device_calendar: ^4.3.3
  # WebDAV 同步的密码存系统加密存储（Android Keystore / iOS Keychain），
  # 不写进 SharedPreferences，也不出现在日志里。
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # 启用 flutter gen-l10n，由 lib/l10n/*.arb 生成 AppLocalizations
  generate: true
