plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// CI / release 环境把签名参数放在 android/key.properties（由 GitHub Secrets 生成，不入库）。
// 本地没有该文件时回退 debug 签名，保证 `flutter build appbundle --release` 仍可跑通。
def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.appforge.demo"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications 的定时通知在 minSdk 21 上需要 java.time 脱糖。
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.appforge.demo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage 9.x 用 EncryptedSharedPreferences，要求 API 23+。
        // 覆盖 Android 6.0 及以上，比 Flutter 默认的 21 收窄一点，功能上无损。
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            // 只有存在 key.properties（CI / 配好 upload key 的本机）时才填充真实凭据。
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // 有 upload key → 用它签名（可上架）；没有 → 回退 debug（仅供本地验证，不可上传商店）。
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // ★ release 默认开 R8。flutter_local_notifications 的已排程列表靠 Gson
            // 序列化，泛型签名被裁掉后 zonedSchedule 会抛 TypeToken 异常，
            // 结果是定时提醒全部失效（立即通知仍正常，所以很难发现）。
            // 规则与成因写在 proguard-rules.pro 里，改之前先读那里的注释。
            proguardFiles 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
